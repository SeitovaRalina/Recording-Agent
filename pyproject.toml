[tool.poetry]
name = "recording-agent"
version = "0.1.0"
description = "Automates interview recording pipeline"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "0.136.*"
uvicorn = { extras = ["standard"], version = ">=0.30" }
sqlalchemy = { extras = ["asyncio"], version = ">=2.0" }
asyncpg = ">=0.30.0"
alembic = ">=1.13"
httpx = ">=0.27"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
apscheduler = ">=3.10,<4"
aiobotocore = ">=2.13"
icalendar = ">=6.0"
charset-normalizer = ">=3.0"
defusedxml = ">=0.7"
tzdata = "*"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
anyio = { extras = ["asyncio"], version = ">=4.0" }
aiosqlite = "*"
ruff = ">=0.12"
mypy = ">=1.15"
respx = ">=0.21"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
